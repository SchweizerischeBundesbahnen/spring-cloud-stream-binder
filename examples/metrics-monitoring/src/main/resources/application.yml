spring:
  cloud:
    function:
      definition: metricsConsumer
    stream:
      bindings:
        metricsPublisher-out-0:
          destination: example/metrics/topic
        metricsConsumer-in-0:
          destination: example/metrics/topic
          group: metrics-group
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: metrics,prometheus
